<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSH Dock · 容器化管理</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   DSH 设计语言(简化复刻)
   色板与语义 token 取自 DSH ui-theme(design-platform.css),
   命名保持 --dsw-* 习惯;暗色经 body[data-ds-dark-theme] 切换。
   ═══════════════════════════════════════════════════════════════════ */

/* ── 字体与动效曲线 ── */
body {
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── 静态色板(与 DSH design-platform.css 一致)── */
body {
  --dsw-nb-00: rgb(255, 255, 255);
  --dsw-nb-50: rgb(249, 250, 251);
  --dsw-nb-60: rgb(245, 246, 247);
  --dsw-nb-75: rgb(241, 243, 245);
  --dsw-nb-100: rgb(235, 238, 242);
  --dsw-nb-150: rgb(233, 236, 242);
  --dsw-nb-200: rgb(225, 229, 238);
  --dsw-nb-300: rgb(207, 211, 214);
  --dsw-nb-400: rgb(173, 178, 184);
  --dsw-nb-600: rgb(129, 133, 140);
  --dsw-nb-700: rgb(97, 102, 107);
  --dsw-nb-750: rgb(67, 69, 74);
  --dsw-nb-800: rgb(53, 54, 56);
  --dsw-nb-850: rgb(44, 44, 46);
  --dsw-nb-875: rgb(35, 35, 36);
  --dsw-nb-900: rgb(27, 27, 28);
  --dsw-nb-950: rgb(21, 21, 23);
  --dsw-nb-1000: rgb(15, 17, 21);
  --dsw-deepseek-400: rgb(103, 158, 254);
  --dsw-deepseek-500: rgb(65, 118, 230);
  --dsw-deepseek-800: rgb(52, 65, 91);
  --dsw-green-100: rgb(230, 250, 237);
  --dsw-green-500: rgb(34, 197, 94);
  --dsw-green-900: rgb(35, 60, 44);
  --dsw-amber-100: rgb(254, 245, 231);
  --dsw-amber-500: rgb(245, 158, 11);
  --dsw-amber-600: rgb(221, 134, 41);
  --dsw-amber-900: rgb(39, 36, 31);
  --dsw-red-50: rgb(254, 242, 242);
  --dsw-red-400: rgb(242, 90, 90);
  --dsw-red-600: rgb(236, 19, 19);
  --dsw-red-900: rgb(87, 12, 12);
  --dsw-neutral-200: rgb(229, 229, 229);
  --dsw-neutral-300: rgb(212, 212, 212);
  --dsw-neutral-600: rgb(84, 85, 87);
  --dsw-neutral-700: rgb(60, 60, 61);
}

/* ── 语义别名:浅色 ── */
body {
  color-scheme: light;
  --dsw-bg-base: var(--dsw-nb-00);
  --dsw-bg-layer-2: var(--dsw-nb-00);
  --dsw-bg-code: var(--dsw-nb-50);
  --dsw-bg-module-platform: var(--dsw-nb-60);
  --dsw-sidebar-fill: var(--dsw-nb-50);
  --dsw-sidebar-hover: var(--dsw-nb-75);
  --dsw-sidebar-active: var(--dsw-nb-100);
  --dsw-label-primary: var(--dsw-nb-1000);
  --dsw-label-secondary: var(--dsw-nb-700);
  --dsw-label-tertiary: var(--dsw-nb-600);
  --dsw-label-dimmed: var(--dsw-nb-400);
  --dsw-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-border-l3: rgba(0, 0, 0, 0.12);
  --dsw-border-l4: rgba(0, 0, 0, 0.16);
  --dsw-interactive-hover: rgba(38, 49, 72, 0.06);
  --dsw-interactive-active: rgba(38, 49, 72, 0.1);
  --dsw-interactive-hover-danger: rgba(236, 19, 19, 0.05);
  --dsw-primary-fill: var(--dsw-nb-1000);
  --dsw-primary-hover: var(--dsw-nb-750);
  --dsw-primary-label: var(--dsw-nb-00);
  --dsw-link: var(--dsw-deepseek-500);
  --dsw-state-success: var(--dsw-green-500);
  --dsw-state-success-bg: var(--dsw-green-100);
  --dsw-state-warn: var(--dsw-amber-600);
  --dsw-state-warn-bg: var(--dsw-amber-100);
  --dsw-state-error: var(--dsw-red-600);
  --dsw-state-error-bg: var(--dsw-red-50);
  --dsw-state-neutral: var(--dsw-label-secondary);
  --dsw-state-neutral-bg: var(--dsw-nb-100);
  --dsw-contrast-fill: var(--dsw-nb-700);
  --dsw-contrast-label: var(--dsw-nb-00);
  --dsw-contrast-track: rgba(255, 255, 255, 0.3);
  --dsw-chip-bg: var(--dsw-nb-60);
  --dsw-chip-hover: var(--dsw-nb-75);
  --dsw-switch-track: var(--dsw-nb-200);
  --dsw-scrollbar-thumb: var(--dsw-neutral-200);
  --dsw-scrollbar-thumb-hover: var(--dsw-neutral-300);
  --dsw-mask: rgba(0, 0, 0, 0.24);
  --dsw-focus-ring: var(--dsw-deepseek-400);
  --dsw-selection: rgb(211, 226, 255);
}

/* ── 语义别名:暗色 ── */
body[data-ds-dark-theme] {
  color-scheme: dark;
  --dsw-bg-base: var(--dsw-nb-950);
  --dsw-bg-layer-2: var(--dsw-nb-850);
  --dsw-bg-code: var(--dsw-nb-900);
  --dsw-bg-module-platform: var(--dsw-nb-800);
  --dsw-sidebar-fill: var(--dsw-nb-900);
  --dsw-sidebar-hover: var(--dsw-nb-850);
  --dsw-sidebar-active: var(--dsw-nb-750);
  --dsw-label-primary: var(--dsw-nb-50);
  --dsw-label-secondary: var(--dsw-nb-300);
  --dsw-label-tertiary: var(--dsw-nb-400);
  --dsw-label-dimmed: var(--dsw-nb-700);
  --dsw-border-l1: rgba(255, 255, 255, 0.06);
  --dsw-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-border-l3: rgba(255, 255, 255, 0.16);
  --dsw-border-l4: rgba(255, 255, 255, 0.2);
  --dsw-interactive-hover: rgba(255, 255, 255, 0.08);
  --dsw-interactive-active: rgba(255, 255, 255, 0.14);
  --dsw-interactive-hover-danger: rgba(242, 90, 90, 0.15);
  --dsw-primary-fill: var(--dsw-nb-50);
  --dsw-primary-hover: var(--dsw-nb-100);
  --dsw-primary-label: var(--dsw-nb-1000);
  --dsw-link: var(--dsw-deepseek-400);
  --dsw-state-success: var(--dsw-green-500);
  --dsw-state-success-bg: var(--dsw-green-900);
  --dsw-state-warn: var(--dsw-amber-600);
  --dsw-state-warn-bg: var(--dsw-amber-900);
  --dsw-state-error: var(--dsw-red-400);
  --dsw-state-error-bg: var(--dsw-red-900);
  --dsw-state-neutral: var(--dsw-nb-300);
  --dsw-state-neutral-bg: rgba(255, 255, 255, 0.08);
  --dsw-contrast-fill: var(--dsw-nb-50);
  --dsw-contrast-label: var(--dsw-nb-800);
  --dsw-contrast-track: rgba(0, 0, 0, 0.2);
  --dsw-chip-bg: var(--dsw-nb-850);
  --dsw-chip-hover: var(--dsw-nb-800);
  --dsw-switch-track: var(--dsw-nb-700);
  --dsw-scrollbar-thumb: var(--dsw-neutral-700);
  --dsw-scrollbar-thumb-hover: var(--dsw-neutral-600);
  --dsw-mask: rgba(0, 0, 0, 0.5);
  --dsw-focus-ring: var(--dsw-deepseek-400);
  --dsw-selection: var(--dsw-deepseek-800);
}

/* ── 全局超椭圆圆角(DSH corner-shape guard);全圆元素逐个配 corner-shape: round ── */
@supports (corner-shape: superellipse(1.5)) {
  :root { --dsw-corner: superellipse(1.5); }
  *, *::before, *::after { corner-shape: var(--dsw-corner); }
}

/* ── 基础 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--dsw-selection); }
body {
  font: 400 14px/22px var(--dsw-font-family);
  background: var(--dsw-bg-base);
  color: var(--dsw-label-primary);
  display: flex;
  min-height: 100vh;
  transition: background 0.2s var(--ds-ease-in-out), color 0.2s var(--ds-ease-in-out);
}

/* ── 侧栏(DSH 浅色侧栏语言:发丝分隔 + r12 导航项;可折叠 rail)── */
aside {
  width: var(--sidebar-w, 200px);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 12px;
  background: var(--dsw-sidebar-fill);
  border-right: 0.5px solid var(--dsw-border-l3);
  color: var(--dsw-label-primary);
  overflow: hidden;
  transition: width 0.3s var(--ds-ease-in-out);
}
/* 折叠编排(DSH slide+crossfade 简化):内容淡出 150ms → 列宽滑动 300ms → rail 布局淡入 */
aside > * { transition: opacity 150ms var(--ds-ease-in-out); }
aside.fading > * { opacity: 0; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 4px 14px; }
.brand-text { min-width: 0; }
.brand-name { display: block; font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: 0.04em; }
.brand-sub { display: block; font-size: 11px; line-height: 14px; color: var(--dsw-label-tertiary); margin-top: 3px; }
.icon-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: 50%;
  corner-shape: round;
  background: transparent;
  color: var(--dsw-label-secondary);
  cursor: pointer;
}
.icon-btn:hover:not(:disabled) { background: var(--dsw-interactive-hover); color: var(--dsw-label-primary); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn .ic-mark { display: none; }
aside nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
aside nav a {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 22px;
  color: var(--dsw-label-primary);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s var(--ds-ease-in-out);
}
aside nav a:hover { background: var(--dsw-sidebar-hover); }
aside nav a.active { background: var(--dsw-sidebar-active); font-weight: 500; }
.nav-icon { flex: none; width: 16px; height: 16px; }
.nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* rail(收起态):56px 窄栏 + 36x36 圆形控件(DSH rail 规格);品牌标常驻,悬停露出展开钮 */
aside.collapsed { width: 56px; padding: 18px 10px 6px; }
aside.collapsed .brand-row { justify-content: center; padding: 0 0 12px; }
aside.collapsed .brand-text { display: none; }
aside.collapsed .icon-btn { width: 36px; height: 36px; color: var(--dsw-label-primary); }
aside.collapsed .icon-btn .ic-panel { display: none; }
aside.collapsed .icon-btn:hover .ic-panel { display: inline; }
aside.collapsed .icon-btn .ic-mark { display: inline; }
aside.collapsed .icon-btn:hover .ic-mark { display: none; }
aside.collapsed nav { gap: 12px; }
aside.collapsed nav a { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; corner-shape: round; }
aside.collapsed .nav-label { display: none; }

/* 侧栏宽度拖拽命中条(DSH AppFrame handle:8px 骑在列缝上,侧栏仅命中条、无可见件) */
#sidebar-resize {
  position: fixed;
  top: 0;
  bottom: 0;
  left: calc(var(--sidebar-w, 200px) - 4px);
  width: 8px;
  cursor: col-resize;
  z-index: 41;
  touch-action: none;
  transition: left 0.3s var(--ds-ease-in-out);
}
/* 拖拽按指针节奏写入宽度:过渡必须 detach,否则列脱手(DSH AppFrame[data-dragging] 同款) */
body[data-dragging] #sidebar-resize { transition: none; }
body[data-dragging] aside { transition: none; }
body[data-dragging] #term { transition: none; }
body[data-dragging] { user-select: none; }
/* ── 设置页 · 外观(DSH AppearanceRow:主题 cube,选中 = 平台底 + 静态 bluish-400 描边)── */
.appearance-cubes { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.theme-cube {
  box-sizing: border-box;
  flex: 1 1 120px;
  max-width: 200px;
  height: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 20px 12px;
  border: 0.5px solid var(--dsw-border-l4);
  border-radius: 16px;
  background: transparent;
  color: var(--dsw-label-primary);
  font: 400 13px/20px var(--dsw-font-family);
  cursor: pointer;
  transition: background 0.2s var(--ds-ease-in-out), border-color 0.2s var(--ds-ease-in-out);
}
.theme-cube:hover:not(.selected) { background: var(--dsw-interactive-hover); }
.theme-cube.selected { background: var(--dsw-bg-module-platform); border-color: var(--dsw-nb-400); }
.theme-cube .swatch {
  flex: none;
  width: 44px;
  height: 28px;
  border-radius: 8px;
  border: 0.5px solid var(--dsw-border-l3);
  background: rgb(255, 255, 255);
}
.theme-cube[data-theme='dark'] .swatch { background: rgb(21, 21, 23); }
.theme-cube[data-theme='system'] .swatch { background: linear-gradient(135deg, rgb(255, 255, 255) 50%, rgb(21, 21, 23) 50%); }

/* ── 主内容 ── */
main { flex: 1; padding: 28px 36px 34px; max-width: 1080px; padding-bottom: calc(var(--term-h, 220px) + 30px); }
h1 { font-size: 20px; font-weight: 500; line-height: 28px; margin-bottom: 4px; }
.subtitle { color: var(--dsw-label-tertiary); font-size: 13px; line-height: 20px; margin-bottom: 20px; }
.panel { border: 0.5px solid var(--dsw-border-l4); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; }
.panel h2 { font-size: 15px; font-weight: 500; line-height: 22px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ── 按钮(DSH 胶囊语言:主按钮近黑填充,普通为发丝描边胶囊)── */
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 36px;
  padding: 0 14px;
  border: 0.5px solid var(--dsw-border-l3);
  border-radius: 18px;
  corner-shape: round;
  background: transparent;
  color: var(--dsw-label-primary);
  font: 400 14px/22px var(--dsw-font-family);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s var(--ds-ease-in-out), color 0.2s var(--ds-ease-in-out),
    border-color 0.2s var(--ds-ease-in-out), opacity 0.2s var(--ds-ease-in-out);
}
button:hover:not(:disabled) { background: var(--dsw-interactive-hover); }
button:active:not(:disabled) { background: var(--dsw-interactive-active); }
button.primary { background: var(--dsw-primary-fill); border-color: transparent; color: var(--dsw-primary-label); }
button.primary:hover:not(:disabled) { background: var(--dsw-primary-hover); }
button.danger { border-color: var(--dsw-state-error); color: var(--dsw-state-error); }
button.danger:hover:not(:disabled) { background: var(--dsw-interactive-hover-danger); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
/* 密集场景(卡片操作/表格行)用小号胶囊 */
.card .actions button, td button { height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; line-height: 20px; }

/* ── 输入框/下拉(DSH Input:r8 发丝描边,focus 转主墨色)── */
input, select {
  height: 32px;
  padding: 0 10px;
  border: 0.5px solid var(--dsw-border-l4);
  border-radius: 8px;
  background: var(--dsw-bg-layer-2);
  color: var(--dsw-label-primary);
  font: 400 13px/20px var(--dsw-font-family);
  outline: none;
  transition: border-color 0.2s var(--ds-ease-in-out);
}
input::placeholder { color: var(--dsw-label-dimmed); }
input:focus, select:focus { border-color: var(--dsw-label-primary); }

/* ── 表格(发丝行分隔)── */
table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
th { text-align: left; padding: 10px; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--dsw-label-tertiary); border-bottom: 0.5px solid var(--dsw-border-l2); }
td { padding: 10px; border-bottom: 0.5px solid var(--dsw-border-l1); }
tr:last-child td { border-bottom: none; }

/* ── 状态徽章(DSH Pill + StateDot:同色光晕点)── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 12px;
  corner-shape: round;
  font-size: 12px;
  line-height: 18px;
}
.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  corner-shape: round;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 15%, transparent);
}
.badge.running { color: var(--dsw-state-success); background: var(--dsw-state-success-bg); }
.badge.starting { color: var(--dsw-state-warn); background: var(--dsw-state-warn-bg); }
.badge.stopped { color: var(--dsw-state-neutral); background: var(--dsw-state-neutral-bg); }
.badge.failed { color: var(--dsw-state-error); background: var(--dsw-state-error-bg); }

/* ── 容器卡片(发丝描边 r16)── */
.card { border: 0.5px solid var(--dsw-border-l4); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.card .name { font-weight: 500; font-size: 15px; line-height: 22px; }
.card .meta { color: var(--dsw-label-tertiary); font-size: 13px; line-height: 20px; margin-bottom: 10px; }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card .url { margin-bottom: 10px; }
.card .url a { color: var(--dsw-link); font-size: 12.5px; line-height: 20px; font-weight: 500; text-decoration: none; word-break: break-all; }
.card .url a:hover, .card .url a:focus-visible { text-decoration: underline dotted; text-underline-offset: 3px; }

.muted { color: var(--dsw-label-tertiary); font-size: 12.5px; line-height: 20px; }
/* 外链(DSH GitHub 仓库):与卡片链接同语言 */
.ext-link { color: var(--dsw-link); font-size: 12.5px; line-height: 20px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.ext-link:hover, .ext-link:focus-visible { text-decoration: underline dotted; text-underline-offset: 3px; }

/* ── 版本管理:左列表 + 右更新说明详情(主内容区右侧原本留白)── */
/* 版本页不设 max-width:让右详情一直填到视口右侧。
   右栏必须 flex-basis:0(用 auto 会按正文内容宽度索要空间,把固定宽的列表压缩)。
   折叠/堆叠判断用容器查询按 main 实际宽度,而不是视口宽度 —— 侧栏拖宽后视口不变但可用宽度变小。 */
main.page-versions { max-width: none; container-type: inline-size; container-name: versions; }
.versions-layout { --ver-list-w: 900px; display: flex; align-items: flex-start; gap: 18px; }
.versions-layout .versions-list { flex: 0 0 var(--ver-list-w); min-width: 0; }
.versions-layout .panel { margin-bottom: 0; }
/* 可用宽度容不下「列表 + 详情最小 280px」时改为上下堆叠(阈值 = --ver-list-w + 18 + 280) */
@container versions (max-width: 1197px) {
  .versions-layout { flex-direction: column; }
  .versions-layout .versions-list { flex: 0 0 auto; width: 100%; }
  .versions-layout .notes-panel { position: static; flex: 0 0 auto; width: 100%; }
}
/* 固定列宽,保证行高与列比例不随说明长短变化;
   操作列左对齐(与其它列一致):不同宽度的按钮共享左边缘,宽的「安装中…」不会向左凸出顶住更新说明。
   104px 要容下按钮 + td 左右各 10px 内边距,否则 table-layout:fixed 下按钮会溢出到相邻列 */
#version-list table { width: 100%; table-layout: fixed; }
#version-list th:nth-child(1), #version-list td:nth-child(1) { width: 22%; }
#version-list th:nth-child(2), #version-list td:nth-child(2) { width: 15%; }
#version-list th:nth-child(4), #version-list td:nth-child(4) { width: 104px; white-space: nowrap; }
/* 更新说明列右侧多留一段:详情按钮靠右时,与操作列按钮只隔 20px 会显拥挤;
   只加大「更新说明 ↔ 操作」这一处间距,版本/状态/更新说明之间保持默认列距 */
#version-list th:nth-child(3), #version-list td:nth-child(3) { padding-right: 30px; }
/* 保险:按钮任何情况下都不得超过本列内容宽(border-box,故 max-width 已含内边距) */
#version-list td:nth-child(4) button { max-width: 100%; }
#version-list tbody tr.active { background: var(--dsw-interactive-hover); }
#version-list tbody tr.active td:first-child { box-shadow: inset 2px 0 0 var(--dsw-primary-fill); }
/* 更新说明在列表里占两行:第一行类型标签 + 详情按钮,第二行单行省略摘要;整格裁切不外溢 */
.ver-notes { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
.ver-notes-tags { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.ver-notes-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--dsw-label-secondary); font-size: 12.5px; line-height: 20px; }
.ver-notes.none .ver-notes-text { color: var(--dsw-label-tertiary); }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; corner-shape: round; font-size: 11.5px; line-height: 16px; white-space: nowrap; flex: 0 0 auto; color: var(--dsw-label-tertiary); background: var(--dsw-state-neutral-bg); }
.chip.breaking { color: var(--dsw-state-error); background: var(--dsw-state-error-bg); }
.chip.feat { color: var(--dsw-state-success); background: var(--dsw-state-success-bg); }
.chip.fix { color: var(--dsw-link); background: color-mix(in srgb, var(--dsw-link) 12%, transparent); }
.chip.perf { color: var(--dsw-state-warn); background: var(--dsw-state-warn-bg); }
.link-btn { flex: 0 0 auto; border: 0; background: none; padding: 0 2px; color: var(--dsw-link); font-size: 12.5px; line-height: 20px; cursor: pointer; font-family: inherit; }
.link-btn:hover, .link-btn:focus-visible { text-decoration: underline dotted; text-underline-offset: 3px; }
/* 右侧详情面板:吃掉列表以外的全部宽度,吸顶不随长列表滚走(flex-basis:0 才不会抢列表空间) */
.notes-panel { position: sticky; top: 12px; flex: 1 1 0; min-width: 280px; }
.notes-panel .np-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.notes-panel .np-title { font-size: 14px; font-weight: 500; line-height: 22px; }
.notes-panel .np-lang { display: inline-flex; gap: 2px; margin-left: auto; }
.notes-panel .lang-btn { border: 0; background: none; padding: 0 7px; border-radius: 7px; corner-shape: round; color: var(--dsw-label-tertiary); font-size: 12px; line-height: 20px; cursor: pointer; font-family: inherit; }
.notes-panel .lang-btn:hover, .notes-panel .lang-btn:focus-visible { color: var(--dsw-label-primary); }
.notes-panel .lang-btn.active { color: var(--dsw-link); background: color-mix(in srgb, var(--dsw-link) 12%, transparent); }
.notes-panel .np-close { margin-left: auto; }
.notes-panel .np-body { max-height: calc(100vh - 320px); overflow: auto; margin-top: 10px; padding-right: 4px; }
.notes-panel .notes-placeholder { color: var(--dsw-label-tertiary); font-size: 13px; line-height: 22px; padding: 22px 4px; }
.notes-heading { color: var(--dsw-label-primary); font-size: 13px; font-weight: 500; line-height: 21px; margin: 12px 0 4px; }
.notes-heading:first-child { margin-top: 2px; }
.notes-item { position: relative; color: var(--dsw-label-secondary); font-size: 13px; line-height: 21px; padding-left: 14px; margin-bottom: 4px; word-break: break-word; }
.notes-item::before { content: ''; position: absolute; left: 2px; top: 9px; width: 4px; height: 4px; border-radius: 50%; corner-shape: round; background: var(--dsw-label-tertiary); }
.notes-para { color: var(--dsw-label-secondary); font-size: 13px; line-height: 21px; margin-bottom: 4px; word-break: break-word; }
.notes-spacer { height: 6px; }
.error-text { color: var(--dsw-state-error); font-size: 13px; line-height: 20px; margin-top: 8px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--dsw-label-tertiary); padding: 30px 0; font-size: 13.5px; line-height: 22px; }

/* ── 任务提示胶囊(DSH Toast/contrast-fill 语言,悬浮于终端上方)── */
#taskbar {
  position: fixed;
  right: 20px;
  bottom: calc(var(--term-h, 220px) + 12px);
  max-width: min(560px, calc(100vw - 240px));
  background: var(--dsw-contrast-fill);
  color: var(--dsw-contrast-label);
  padding: 10px 16px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 22px;
  display: none;
  align-items: center;
  gap: 10px;
  z-index: 45;
  box-shadow: 0 0 1px 0 rgba(0, 0, 0, 0.2), 0 12px 32px 0 rgba(0, 0, 0, 0.08);
}
#taskbar .spinner {
  width: 14px;
  height: 14px;
  flex: none;
  border: 2px solid var(--dsw-contrast-track);
  border-top-color: currentColor;
  border-radius: 50%;
  corner-shape: round;
  animation: spin 0.8s linear infinite;
}
#taskbar-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 底部终端(DSH TerminalBlock:跟随主题的代码面 + 代码字体)── */
#term {
  position: fixed;
  left: var(--sidebar-w, 200px);
  right: 0;
  bottom: 0;
  height: 220px;
  background: var(--dsw-bg-code);
  color: var(--dsw-label-primary);
  display: flex;
  flex-direction: column;
  z-index: 40;
  border-top: 0.5px solid var(--dsw-border-l2);
  transition: left 0.3s var(--ds-ease-in-out);
}
#term-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 14px;
  color: var(--dsw-label-secondary);
  font-size: 12px;
  line-height: 18px;
  user-select: none;
  flex-shrink: 0;
  border-bottom: 0.5px solid var(--dsw-border-l1);
}
#term-head b { color: var(--dsw-label-primary); font-size: 12.5px; font-weight: 500; }
#term-head .sp { flex: 1; }
#term-head a { cursor: pointer; }
#term-head a:hover { color: var(--dsw-label-primary); }
#term-body {
  flex: 1;
  overflow: auto;
  margin: 0;
  padding: 8px 14px;
  font: 400 12px/19px var(--dsw-font-code);
  white-space: pre-wrap;
  word-break: break-all;
}
#term-resize { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
#term.collapsed { height: auto !important; }
#term.collapsed #term-body { display: none; }

/* ── 模态(DSH Modal:r24 + 发丝描边柔光投影 + 遮罩模糊)── */
.modal-mask {
  position: fixed;
  inset: 0;
  background: var(--dsw-mask);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.modal {
  background: var(--dsw-bg-layer-2);
  border-radius: 24px;
  width: min(860px, 92vw);
  max-height: 84vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 0 0.5px var(--dsw-border-l4), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
}
.modal .m-head { padding: 16px 18px 12px 24px; border-bottom: 0.5px solid var(--dsw-border-l2); display: flex; justify-content: space-between; align-items: center; }
.modal .m-head b { font-size: 16px; font-weight: 500; line-height: 24px; }
.modal .m-body { padding: 16px 24px 24px; overflow: auto; }
pre.log {
  background: var(--dsw-bg-code);
  color: var(--dsw-label-primary);
  padding: 14px;
  border-radius: 12px;
  font: 400 12px/19px var(--dsw-font-code);
  max-height: 60vh;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── 容器卡片内:版本选择框 / 日志路径 ── */
/* ── 统一下拉外观:native select 与自定义下拉共用同一套度量 ── */
select, .ver-select, .dd-trigger {
  height: 30px;
  box-sizing: border-box;
  padding: 0 8px;
  border: 0.5px solid var(--dsw-border-l4);
  border-radius: 8px;
  background: var(--dsw-bg-module, transparent);
  color: var(--dsw-label-primary);
  font-size: 12.5px;
  line-height: 18px;
  vertical-align: middle;
}
.ver-select { width: auto; max-width: 210px; }
.logpath { font-size: 11.5px; line-height: 16px; color: var(--dsw-label-tertiary); font-family: var(--dsw-font-code); margin-bottom: 8px; word-break: break-all; }

/* ── 开发保护开关 ── */
.switch-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 20px; color: var(--dsw-label-tertiary); user-select: none; }
.switch { position: relative; display: inline-block; width: 34px; height: 18px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute;
  inset: 0;
  background: var(--dsw-switch-track);
  border-radius: 18px;
  corner-shape: round;
  transition: 0.2s var(--ds-ease-in-out);
  cursor: pointer;
}
.switch .slider::before {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  left: 2px;
  top: 2px;
  background: var(--dsw-nb-00);
  border-radius: 50%;
  corner-shape: round;
  transition: 0.2s var(--ds-ease-in-out);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.switch input:checked + .slider { background: var(--dsw-state-success); }
.switch input:checked + .slider::before { transform: translateX(16px); }

/* ── 端口 chip(DSH Selector/Pill 语言)── */
.port-edit { cursor: pointer; }
.port-edit:hover { color: var(--dsw-label-primary); background: var(--dsw-chip-hover); }

/* ── 行内提示气泡(hover/focus 显示,内容写在 .tip-bubble 里)── */
.tip { position: relative; display: inline-block; cursor: help; }
.tip .tip-bubble {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 300px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--dsw-contrast-fill);
  color: var(--dsw-contrast-label);
  font-size: 12px;
  line-height: 18px;
  font-weight: 400;
  white-space: normal;
  word-break: break-word;
  z-index: 60;
  box-shadow: 0 0 1px 0 rgba(0, 0, 0, 0.2), 0 12px 32px 0 rgba(0, 0, 0, 0.08);
}
.tip:hover .tip-bubble, .tip:focus-visible .tip-bubble { display: block; }

/* ── 镜像快捷 chip ── */
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border-radius: 13px;
  corner-shape: round;
  background: var(--dsw-chip-bg);
  color: var(--dsw-label-secondary);
  font-size: 12px;
  line-height: 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s var(--ds-ease-in-out), color 0.2s var(--ds-ease-in-out);
}
.chip:hover { color: var(--dsw-label-primary); background: var(--dsw-chip-hover); }

/* ── 滚动条(DSH scrollbar.css:8px 透明轨道,主题化 thumb)── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 4px; corner-shape: round; background: var(--dsw-scrollbar-thumb); }
::-webkit-scrollbar-thumb:hover { background: var(--dsw-scrollbar-thumb-hover); }
::-webkit-scrollbar-corner { background: transparent; }
@supports not selector(::-webkit-scrollbar) {
  body, body * { scrollbar-width: thin; scrollbar-color: var(--dsw-scrollbar-thumb) transparent; }
}

/* ── 键盘焦点可见性 ── */
:where(button, a, .chip, .switch):focus-visible { outline: 2px solid var(--dsw-focus-ring); outline-offset: 2px; }

/* ── 动效降级(保留 spinner 以传达进行中状态)── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01s !important; }
}

/* ── 模型配置表(provider 行 / 编辑器 / 模型目录)── */
.prov-row { display: flex; align-items: center; gap: 10px; border: 0.5px solid var(--dsw-border-l4); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.prov-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; flex-wrap: wrap; }
.prov-name { font-weight: 500; font-size: 13.5px; line-height: 20px; }
.prov-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.prov-actions button { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
.dot.ok { background: var(--dsw-state-success); }
.dot.miss { background: var(--dsw-state-error); }
.field { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.field > label { width: 96px; flex: 0 0 auto; color: var(--dsw-label-tertiary); font-size: 12.5px; line-height: 20px; }
.field > input, .field > select { flex: 1 1 auto; min-width: 0; }
details.adv { margin: 10px 0 2px; border-top: 0.5px solid var(--dsw-border-l2); padding-top: 10px; }
details.adv summary { cursor: pointer; color: var(--dsw-label-tertiary); font-size: 12.5px; line-height: 20px; margin-bottom: 8px; }
.model-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; flex-wrap: wrap; }
.model-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.model-row input { min-width: 0; }
.model-caps { grid-column: 1 / -1; display: flex; gap: 12px; padding: 4px 0 2px; flex-wrap: wrap; }
.model-caps label { display: flex; align-items: center; gap: 6px; color: var(--dsw-label-tertiary); font-size: 12px; line-height: 18px; }
.model-caps input { width: 110px; }
.tiny { height: 26px !important; padding: 0 8px !important; border-radius: 13px !important; font-size: 12px !important; }
.dashed { border: 0.5px dashed var(--dsw-border-l4) !important; background: transparent !important; width: 100%; height: 34px; border-radius: 16px; color: var(--dsw-label-secondary); font-size: 12.5px; }
.link-btn { background: transparent !important; border: none !important; color: var(--dsw-link) !important; padding: 0 4px !important; height: auto !important; font-size: 12.5px; }
.fetch-item { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13px; }
.fetch-item code { font-family: var(--dsw-font-code); font-size: 12.5px; }
.fetch-list { max-height: 320px; overflow: auto; border: 0.5px solid var(--dsw-border-l4); border-radius: 10px; padding: 8px 10px; }
.dd { position: relative; display: block; width: 100%; max-width: 860px; }
.dd-trigger { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 100%; cursor: pointer; }
.dd-label { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; }
.dd-caret { flex: 0 0 auto; color: var(--dsw-label-tertiary); }
.dd-panel { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; width: 100%; box-sizing: border-box; max-height: 340px; overflow-y: auto; overflow-x: hidden; padding: 4px; border: 0.5px solid var(--dsw-border-l4); border-radius: 12px; background: var(--dsw-bg-elevated, var(--dsw-state-neutral-bg)); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
.dd-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; font-size: 13px; line-height: 20px; cursor: pointer; }
.dd-name { flex: 0 0 auto; white-space: nowrap; }
.dd-prov { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--dsw-label-tertiary); }
.dd-tag { flex: 0 0 auto; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 18px; color: var(--dsw-label-tertiary); background: var(--dsw-state-neutral-bg); }
.dd-item:hover { background: var(--dsw-chip-hover); }
.dd-item.active { background: color-mix(in srgb, var(--dsw-link) 10%, transparent); }
.dd-x { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--dsw-label-tertiary); font-size: 12px; line-height: 22px; cursor: pointer; }
.dd-x:hover { color: var(--dsw-state-error); background: var(--dsw-state-error-bg); }
.dd-star { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--dsw-label-tertiary); font-size: 13px; line-height: 22px; cursor: pointer; }
.dd-star:hover { background: var(--dsw-chip-hover); color: var(--dsw-state-warn); }
.dd-star.on { color: var(--dsw-state-warn); }
.chip-warn { color: var(--dsw-state-error); background: var(--dsw-state-error-bg); }
.model-detail-frame { min-height: 316px; }
</style>
</head>

    const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)

        <rect x="0.5" y="0.5" width="15" height="15" rx="4.5" style="fill: currentColor"/>
        <text x="8" y="11.6" text-anchor="middle" font-size="9.5" font-weight="600" style="fill: var(--dsw-sidebar-fill)">D</text>
      </svg>
    </button>
  </div>
  <nav id="nav">
    <a data-page="versions" class="active" title="版本管理">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <span class="nav-label">版本管理</span>
    </a>
    <a data-page="containers" title="容器管理">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="nav-label">容器管理</span>

    <a data-page="settings" title="设置">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span class="nav-label">设置</span>
    </a>
  </nav>
</aside>
<main id="main"></main>

<div id="taskbar"><div class="spinner"></div><span id="taskbar-text"></span></div>

<div id="term">
  <div id="term-head" ondblclick="termToggle()"><b>终端输出</b><span id="term-hint"></span><span class="sp"></span><a onclick="termClear()">清空</a><a id="term-toggle" onclick="termToggle()">收起 ▾</a></div>
  <pre id="term-body"></pre>
  <div id="term-resize"></div>
</div>

<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="m-head"><b id="modal-title"></b><button onclick="closeModal()">关闭</button></div>
    <div class="m-body" id="modal-body"></div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel)
const api = async (path, options = {}) => {
  const response = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) throw body.error || `HTTP ${response.status}`
  return body
}

let activeTasks = {} // refId -> task (用于按钮进度态)

// ── 外观主题(浅色/深色/跟随系统,持久化到 localStorage)──
const THEME_KEY = 'dshdock.theme'
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)')
function resolveThemeDark(pref) {
  return pref === 'dark' || (pref === 'system' && darkQuery.matches)
}
function themePref() {
  return localStorage.getItem(THEME_KEY) || 'system'
}
function applyTheme(pref) {
  document.body.toggleAttribute('data-ds-dark-theme', resolveThemeDark(pref))
  document.querySelectorAll('.theme-cube').forEach((b) => {
    const on = b.dataset.theme === pref
    b.classList.toggle('selected', on)
    b.setAttribute('aria-pressed', String(on))
  })
}
function setTheme(pref) {
  localStorage.setItem(THEME_KEY, pref)
  applyTheme(pref)
}
darkQuery.addEventListener('change', () => applyTheme(themePref()))
applyTheme(themePref())

// ── 侧栏折叠 + 宽度拖拽(DSH rail/AppFrame handle 语言)──
const SIDEBAR_KEY = 'dshdock.sidebar'
const SIDEBAR_W_KEY = 'dshdock.sidebarWidth'
const SIDEBAR_RAIL_W = '56px'
const SIDEBAR_MIN = 160
const SIDEBAR_MAX = 440
const SIDEBAR_RAIL_SNAP = 110 // 拖拽越过该宽度即吸附为 rail
function setSidebarWidth(w) {
  document.documentElement.style.setProperty('--sidebar-w', w)
}
// 展开宽度(持久化;越界/缺省回退 200)
function sidebarWidth() {
  const raw = Number(localStorage.getItem(SIDEBAR_W_KEY))
  return Number.isFinite(raw) && raw >= SIDEBAR_MIN && raw <= SIDEBAR_MAX ? raw : 200
}
// 直接套用折叠/展开态(boot 恢复、编排中段、拖拽越界吸附共用;不做动画)
function setSidebarState(collapsed) {
  const aside = document.querySelector('aside')
  const btn = $('#sidebar-toggle')
  aside.classList.toggle('collapsed', collapsed)
  setSidebarWidth(collapsed ? SIDEBAR_RAIL_W : `${sidebarWidth()}px`)
  btn.title = collapsed ? '展开侧栏' : '收起侧栏'
  btn.setAttribute('aria-expanded', String(!collapsed))
}
function toggleSidebar() {
  const aside = document.querySelector('aside')
  const collapsing = !aside.classList.contains('collapsed')
  aside.classList.add('fading')
  setTimeout(() => {
    setSidebarState(collapsing)
    localStorage.setItem(SIDEBAR_KEY, collapsing ? 'collapsed' : 'expanded')
    requestAnimationFrame(() => requestAnimationFrame(() => aside.classList.remove('fading')))
  }, 160)
}
$('#sidebar-toggle').onclick = toggleSidebar
// 恢复上次宽度与折叠状态(主脚本先于首帧执行,直接套用、不动画)
setSidebarWidth(`${sidebarWidth()}px`)
if (localStorage.getItem(SIDEBAR_KEY) === 'collapsed') setSidebarState(true)

// 宽度拖拽:8px 命中条骑在列缝上,拖拽按指针节奏写入(过渡由 body[data-dragging] 关闭)
// move/up 挂在 window 上:拖出命中条、指针捕获失效等场景都能继续跟手
;(() => {
  const handle = document.createElement('div')
  handle.id = 'sidebar-resize'
  document.body.appendChild(handle)
  let dragging = false
  const persist = () => {
    const aside = document.querySelector('aside')
    if (aside.classList.contains('collapsed')) {
      localStorage.setItem(SIDEBAR_KEY, 'collapsed')
    } else {
      localStorage.setItem(SIDEBAR_KEY, 'expanded')
      const w = document.documentElement.style.getPropertyValue('--sidebar-w')
      localStorage.setItem(SIDEBAR_W_KEY, String(parseInt(w, 10) || 200))
    }
  }
  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    dragging = true
    document.body.setAttribute('data-dragging', '')
    e.preventDefault()
  })
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return
    if (e.clientX < SIDEBAR_RAIL_SNAP) {
      setSidebarState(true) // 吸附 rail(固定 56px)
    } else {
      setSidebarState(false)
      setSidebarWidth(`${Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, e.clientX + 2))}px`)
    }
  })
  const endDrag = () => {
    if (!dragging) return
    dragging = false
    document.body.removeAttribute('data-dragging')
    persist()
  }
  window.addEventListener('pointerup', endDrag)
  window.addEventListener('pointercancel', endDrag)
})()

// ── 底部终端窗口(可缩放/收起,全局常驻,跨页面保留 —— 待办③) ──
const termLines = []
const TERM_MAX = 800
function termRender() {
  const el = $('#term-body')
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 48
  el.textContent = termLines.join('\n')
  if (nearBottom) el.scrollTop = el.scrollHeight
  $('#term-hint').textContent = `${termLines.length} 行`
}
function termAppend(line) {
  termLines.push(String(line))
  if (termLines.length > TERM_MAX) termLines.splice(0, termLines.length - TERM_MAX)
  termRender()
}
function termClear() { termLines.length = 0; termRender() }
function termToggle() {
  const t = $('#term')
  const collapsed = t.classList.toggle('collapsed')
  $('#term-toggle').textContent = collapsed ? '展开 ▴' : '收起 ▾'
  if (collapsed) {
    document.documentElement.style.setProperty('--term-h', '34px')
  } else {
    document.documentElement.style.setProperty('--term-h', localStorage.getItem('dshdock.termHeight') || '220px')
    termRender()
  }
}
// 拖拽上边缘调整高度
;(() => {
  const handle = $('#term-resize'), term = $('#term')
  handle.addEventListener('mousedown', (e) => {
    const startY = e.clientY, startH = term.offsetHeight
    const move = (ev) => {
      const h = Math.min(window.innerHeight - 140, Math.max(34, startH + (startY - ev.clientY)))
      term.style.height = h + 'px'
      document.documentElement.style.setProperty('--term-h', h + 'px')
      if (!term.classList.contains('collapsed')) localStorage.setItem('dshdock.termHeight', String(h))
    }
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up) }
    document.addEventListener('mousemove', move)
    document.addEventListener('mouseup', up)
    e.preventDefault()
  })
})()
if (localStorage.getItem('dshdock.termHeight')) {
  $('#term').style.height = localStorage.getItem('dshdock.termHeight') + 'px'
  document.documentElement.style.setProperty('--term-h', localStorage.getItem('dshdock.termHeight') + 'px')
}

// 把服务端任务列表合并进 activeTasks:页面切换/重连后,进行中任务的状态不丢(待办④)
function mergeTaskSnapshot(list) {
  const runningRefs = new Set()
  for (const t of list) {
    if (t.status === 'running') {
      runningRefs.add(t.refId)
      activeTasks[t.refId] = t
    }
  }
  for (const refId of Object.keys(activeTasks)) {
    if (!runningRefs.has(refId)) delete activeTasks[refId]
  }
  updateTaskbar()
}
async function syncTasks() {
  try {
    mergeTaskSnapshot(await api('/api/tasks'))
  } catch {}
}

// ── SSE ──
const es = new EventSource('/events')
es.onmessage = (event) => {
  try {
    const { event: name, payload } = JSON.parse(event.data)
    if (name === 'snapshot') {
      mergeTaskSnapshot(payload)
      // 回填最近几个任务的关键输出,方便接续观察
      for (const t of [...payload].reverse().slice(-5)) {
        termAppend(`──── ${t.label} ────`)
        for (const l of (t.lines ?? []).slice(-60)) termAppend(l)
        termAppend(t.status === 'running' ? `▶ ${t.label}(进行中)` : t.status === 'failed' ? `✘ ${t.label}: ${t.error ?? ''}` : `✔ ${t.label}`)
      }
    } else if (name === 'task') {
      activeTasks[payload.refId] = payload
      if (payload.status === 'running') termAppend(`▶ ${payload.label}`)
      else if (payload.status === 'failed') termAppend(`✘ ${payload.label}: ${payload.error ?? ''}`)
      else termAppend(`✔ ${payload.label}`)
      if (payload.status !== 'running') {
        setTimeout(() => { delete activeTasks[payload.refId]; renderCurrent() }, 1500)
      }
      updateTaskbar()
      renderCurrent()
    } else if (name === 'task-line') {
      termAppend(payload.line)
      const task = Object.values(activeTasks).find((t) => t.id === payload.id)
      if (task) {
        task.lines = task.lines || []
        task.lines.push(payload.line)
        updateTaskbar()
      }
    } else if (name === 'log') {
      termAppend(payload)
    }
  } catch {}
}

function updateTaskbar() {
  const running = Object.values(activeTasks).find((t) => t.status === 'running')
  const bar = $('#taskbar')
  if (!running) { bar.style.display = 'none'; return }
  bar.style.display = 'flex'
  const last = (running.lines ?? []).slice(-1)[0] ?? running.label
  $('#taskbar-text').textContent = `${running.label} — ${last}`
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

function toast(message, isError = false) {
  const bar = $('#taskbar')
  bar.style.display = 'flex'
  $('#taskbar-text').textContent = message
  $('#taskbar .spinner').style.display = 'none'
  if (isError) $('#taskbar-text').style.color = 'var(--dsw-state-error)'
  setTimeout(() => {
    bar.style.display = 'none'
    $('#taskbar-text').style.color = ''
    $('#taskbar .spinner').style.display = ''
    updateTaskbar()
  }, isError ? 6000 : 3000)
}

// ── 页面路由 ──
let currentPage = 'versions'
document.querySelectorAll('#nav a').forEach((a) => {
  a.onclick = () => {
    document.querySelectorAll('#nav a').forEach((x) => x.classList.remove('active'))
    a.classList.add('active')
    currentPage = a.dataset.page
    renderCurrent()
  }
})
async function renderCurrent() {
  await syncTasks() // 先取回服务端任务状态,再渲染当前页(待办④)
  $('#main').classList.toggle('page-versions', currentPage === 'versions')
  if (currentPage === 'versions') renderVersions()
  else if (currentPage === 'containers') renderContainers()
  else if (currentPage === 'settings') renderSettings()
}

// ── 版本管理 ──
// DSH 上游仓库(服务端目录接口同时回传 repo,此处为兜底常量)
const DSH_REPO_FALLBACK = 'https://github.com/deepseek-ai/deepseek-harness'

// 更新说明:服务端刷新目录时抓正文存本地(零网络查看)。列表里只放一行
// 启发式摘要 + 变更类型徽标,完整正文放右侧详情面板,点「详情」后渲染。
const NOTE_TYPE_LABEL = { breaking: '破坏性', feat: '新增', fix: '修复', perf: '优化' }
const NOTE_LANG_NAV = /^(中文\s*[|｜]\s*English|English\s*[|｜]\s*中文)$/
const hasCjk = (text) => /[\u4e00-\u9fff]/.test(text)
let versionCatalogTags = [] // 最近一次目录数据(详情面板按 tag 取正文,避免正文内联进每行)
let selectedVersionTag = null
// 详情面板语言(服务端已按锚点切成 zh/en;无切分时退回全量正文)
let notesLang = (() => {
  try { return window.localStorage.getItem('dshdock-notes-lang') || 'zh' } catch { return 'zh' }
})()
/** 切换详情面板语言并立即重渲染当前选中版本。 */
function setNotesLang(lang) {
  notesLang = lang
  try { window.localStorage.setItem('dshdock-notes-lang', lang) } catch { /* 无存储时仅本次会话生效 */ }
  if (selectedVersionTag !== null) showVersionNotes(selectedVersionTag)
}

/** 去掉 bullet 前缀、@作者提及(含逗号分隔的作者列表)与句末分隔符/标点,便于拼一行摘要。 */
function tidyNoteLine(line) {
  return line
    .replace(/^·\s*/, '')
    .replace(/@[A-Za-z0-9_-]+/g, '')
    .replace(/[\s,，、;；|—–-]+$/, '')
    .replace(/^[\s,，、;；|—–-]+/, '')
    .replace(/[。.;；,、]\s*$/, '')
    .trim()
}
/** 启发式一行摘要(确定性、零网络):优先中文 bullet,其次任意 bullet,最后退回首条实质文本。
    不做字数截断——列表里靠 CSS text-overflow 在真正的行尾出省略号,避免"没填满就省略"。 */
function summarizeNotes(body) {
  const lines = String(body ?? '').replace(/\r\n?/g, '\n').split('\n').map((line) => line.trim())
    .filter((line) => line.length > 0 && !NOTE_LANG_NAV.test(line))
  const bullets = lines.filter((line) => line.startsWith('·'))
  const cjkBullets = bullets.filter(hasCjk)
  const pool = (cjkBullets.length > 0 ? cjkBullets : bullets).map(tidyNoteLine).filter((line) => line.length > 0)
  if (pool.length === 0) {
    return lines.map(tidyNoteLine).find((line) => line.length > 4 && hasCjk(line)) ?? tidyNoteLine(lines[0] ?? '')
  }
  return pool[1] !== undefined && pool[0].length < 22 ? `${pool[0]};${pool[1]}` : pool[0]
}
/** 变更类型识别(按展示顺序;正文含对应关键词即命中)。 */
function noteTypes(body) {
  const text = String(body ?? '')
  const types = []
  if (/破坏性|不兼容|BREAKING/i.test(text)) types.push('breaking')
  if (/新功能|新增|支持|Features?\b|Added\b|\bNew\b/i.test(text)) types.push('feat')
  if (/修复|修正|Fixed?\b|Bug\s?fix/i.test(text)) types.push('fix')
  if (/优化|提升|改进|性能|Improve|Perf|Refine|Polish/i.test(text)) types.push('perf')
  return types
}
function typeChips(types) {
  return types.map((type) => `<span class="chip ${type}">${NOTE_TYPE_LABEL[type]}</span>`).join('')
}
/** 列表单元格:类型徽标 + 单行省略摘要 + 详情按钮。 */
function versionNotesCell(tag) {
  const notes = tag?.notes
  const body = typeof notes?.body === 'string' ? notes.body : ''
  if (body.trim().length === 0) {
    return '<div class="ver-notes none"><span class="ver-notes-text">无更新说明</span></div>'
  }
  // 服务端若写入 notes.summary(如日后接 LLM 摘要)则优先,否则用本地启发式(优先中文段)
  const stored = typeof notes.summary === 'string' ? notes.summary.trim() : ''
  const source = typeof notes.zh === 'string' && notes.zh.trim().length > 0 ? notes.zh : body
  const summary = stored.length > 0 ? stored : summarizeNotes(source)
  // 第一行标签(全部展示,不折叠)+ 详情,第二行摘要
  return `<div class="ver-notes">`
    + `<div class="ver-notes-tags">${typeChips(noteTypes(body))}`
    + `<button class="link-btn" onclick="showVersionNotes('${escapeHtml(tag.name)}')">详情</button></div>`
    + `<div class="ver-notes-text" title="${escapeHtml(summary)}">${escapeHtml(summary)}</div></div>`
}
/** 完整正文排版:短行=小标题,· 开头=条目,其余=段落(连续空行只保留一个)。 */
function renderNotesBody(body) {
  const html = []
  let lastSpacer = false
  for (const raw of String(body ?? '').replace(/\r\n?/g, '\n').split('\n')) {
    const line = raw.trim()
    if (line.length === 0) {
      if (!lastSpacer && html.length > 0) html.push('<div class="notes-spacer"></div>')
      lastSpacer = true
      continue
    }
    lastSpacer = false
    if (NOTE_LANG_NAV.test(line)) continue
    if (line.startsWith('·')) {
      html.push(`<div class="notes-item">${escapeHtml(line.replace(/^·\s*/, ''))}</div>`)
    } else if (line.length <= 20 && !/[。.!?？;；:：,、]$/.test(line)) {
      html.push(`<div class="notes-heading">${escapeHtml(line)}</div>`)
    } else {
      html.push(`<div class="notes-para">${escapeHtml(line)}</div>`)
    }
  }
  return html.join('')
}
function versionNotesPlaceholder() {
  return '<p class="notes-placeholder">点击左侧「详情」查看该版本的完整更新说明。<br>说明由服务端在刷新目录时抓取并保存在本地。</p>'
}
/** 右侧详情面板:显示某版本的完整更新说明(可切中/英/全部,不离开列表页)。 */
function showVersionNotes(tagName) {
  const head = $('#notes-panel-head')
  const panel = $('#notes-panel-body')
  if (head === null || panel === null) return
  selectedVersionTag = tagName
  document.querySelectorAll('#version-list tr[data-tag]').forEach((row) => {
    row.classList.toggle('active', row.dataset.tag === tagName)
  })
  const tag = versionCatalogTags.find((entry) => entry?.name === tagName)
  const notes = tag?.notes
  const zh = typeof notes?.zh === 'string' ? notes.zh.trim() : ''
  const en = typeof notes?.en === 'string' ? notes.en.trim() : ''
  const full = typeof notes?.body === 'string' ? notes.body.trim() : ''
  if (full.length === 0 && zh.length === 0) {
    head.innerHTML = `<span class="np-title">${escapeHtml(tagName)}</span>`
    panel.innerHTML = '<p class="notes-placeholder">该版本未提供更新说明(远端没有对应 Release 正文)。</p>'
    return
  }
  const bilingual = zh.length > 0 && en.length > 0
  const shown = bilingual ? (notesLang === 'en' ? en : notesLang === 'all' ? full : zh) : full
  const langToggle = bilingual
    ? `<span class="np-lang">${[['zh', '中文'], ['en', 'English'], ['all', '全部']]
        .map(([key, label]) => `<button class="lang-btn${notesLang === key ? ' active' : ''}" onclick="setNotesLang('${key}')">${label}</button>`)
        .join('')}</span>`
    : ''
  const date = notes.publishedAt
    ? `<span class="muted">${escapeHtml(String(notes.publishedAt).slice(0, 10))} 发布</span>`
    : ''
  head.innerHTML = `<span class="np-title">${escapeHtml(tagName)}</span>${typeChips(noteTypes(full))}${date}${langToggle}`
  panel.innerHTML = renderNotesBody(shown)
}
async function renderVersions(refresh = false) {
  const main = $('#main')
  main.innerHTML = `<h1>版本管理</h1><div class="subtitle">deepseek-harness 的可用版本;安装后即可用于创建容器</div>
    <div class="versions-layout">
      <div class="panel versions-list"><div id="version-list"><div class="empty">加载中...</div></div></div>
      <div class="panel notes-panel">
        <div class="np-head" id="notes-panel-head"><span class="np-title">更新说明</span></div>
        <div id="notes-panel-body">${versionNotesPlaceholder()}</div>
      </div>
    </div>`
  try {
    const data = await api('/api/versions/catalog' + (refresh ? '?refresh=1' : ''))
    const repo = data.repo || DSH_REPO_FALLBACK
    versionCatalogTags = Array.isArray(data.tags) ? data.tags : []
    const installedSet = new Set(data.installed)
    const rows = versionCatalogTags.map((tag) => {
      const installed = installedSet.has(tag.name)
      const task = activeTasks[`vi:${tag.name}`]
      const progress = task ? `<div class="muted">${escapeHtml((task.lines ?? []).slice(-1)[0] ?? '')}</div>` : ''
      return `<tr data-tag="${escapeHtml(tag.name)}">
        <td><b>${escapeHtml(tag.name)}</b></td>
        <td>${installed ? '<span class="badge running">已安装</span>' : '<span class="badge stopped">未安装</span>'}${progress}</td>
        <td>${versionNotesCell(tag)}</td>
        <td>
          ${installed
            ? `<button class="danger" onclick="removeVersion('${tag.name}')">删除</button>`
            : `<button class="primary" ${task?.status === 'running' ? 'disabled' : ''} onclick="installVersion('${tag.name}')">${task?.status === 'running' ? '安装中…' : '安装'}</button>`}
        </td>
      </tr>`
    })
    const extraInstalled = data.installed.filter((v) => !versionCatalogTags.some((t) => t.name === v))
      .map((v) => `<tr data-tag="${escapeHtml(v)}"><td><b>${escapeHtml(v)}</b></td><td><span class="badge running">已安装</span></td><td><div class="ver-notes none"><span class="ver-notes-text">不在远端目录中(可能已删除)</span></div></td><td><button class="danger" onclick="removeVersion('${v}')">删除</button></td></tr>`)
    const withNotes = versionCatalogTags.filter((tag) => tag.notes?.body).length
    $('#version-list').innerHTML = `
      <div class="row" style="margin-bottom:10px">
        <button class="primary" onclick="refreshCatalog()">刷新目录</button>
        <a class="ext-link" href="${repo}" target="_blank" rel="noreferrer noopener">DSH GitHub 仓库 ↗</a>
        <span class="muted">目录更新于 ${data.fetchedAt ? new Date(data.fetchedAt * 1000).toLocaleString('zh-CN') : '从未'}${data.warning ? ' · ' + escapeHtml(data.warning) : ''}${withNotes > 0 ? ` · 更新说明 ${withNotes} 条` : ''}</span>
      </div>
      <table><thead><tr><th>版本</th><th>状态</th><th>更新说明</th><th>操作</th></tr></thead>
      <tbody>${rows.join('')}${extraInstalled.join('')}</tbody></table>
      ${versionCatalogTags.length === 0 && data.installed.length === 0 ? '<div class="empty">目录为空,点击「刷新目录」从 GitHub 拉取</div>' : ''}`
    // 刷新/任务事件会整页重渲染,保留用户已选中的详情
    if (selectedVersionTag !== null && versionCatalogTags.some((tag) => tag.name === selectedVersionTag)) {
      showVersionNotes(selectedVersionTag)
    }
  } catch (error) {
    // 目录刷新失败时用户可能已经切到别的页面:没有版本列表节点就别写(否则在错误路径里再抛一次)
    const listBox = $('#version-list')
    if (listBox !== null) listBox.innerHTML = `<div class="error-text">${escapeHtml(error)}<br><br><button onclick="refreshCatalog()">重试</button></div>`
  }
}

async function renderContainers() {
  const main = $('#main')

    <h1>容器管理</h1><div class="subtitle">每个容器是某个 DSH 版本的独立运行实例</div>

      </div>
    </div>
    <div id="container-list"><div class="empty">加载中...</div></div>`

  const [containers, catalog] = await Promise.all([
    api('/api/containers').catch(() => []),
    api('/api/versions/catalog').catch(() => ({ installed: [] })),
  ])
  const select = $('#c-version')
  if (catalog.installed.length === 0) {
    select.innerHTML = '<option value="">无已安装版本,请先到版本管理安装</option>'
  } else {
    // 默认选中上次创建用的版本,否则最新版本(版本名自然降序,首个为最新)
    const versions = [...catalog.installed].sort(versionDesc)
    const last = localStorage.getItem('dshdock-last-version')
    const def = versions.includes(last) ? last : versions[0]
    select.innerHTML = versions.map((v) => `<option value="${escapeHtml(v)}" ${v === def ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')
  }

  const listHtml = containers.map((c) => {
    const task = activeTasks[c.id]
    const statusBadge = { running: '运行中', starting: '启动中', stopped: '已停止', failed: '失败' }[c.status] ?? c.status
    const actions = []
    // 创建/更新任务未完成时,锁定操作(与服务端 busyTaskFor 门禁一致)
    const busy = task?.status === 'running' && (task.kind === 'container-create' || task.kind === 'container-update')
    if (busy) {
      actions.push(`<button disabled>${task.kind === 'container-create' ? '创建中…' : '更新中…'}</button>`)
    } else if (c.status === 'running') {
      actions.push(`<button class="primary" onclick="openContainer('${c.id}')">打开 DSH UI</button>`)
      actions.push(`<button onclick="stopContainer('${c.id}')">停止</button>`)
    } else if (c.status === 'starting') {
      actions.push(`<button disabled>启动中…</button>`)
    } else {
      actions.push(`<button class="primary" onclick="startContainer('${c.id}')">启动</button>`)
    }
    actions.push(`<button class="danger" onclick="removeContainer('${c.id}','${escapeHtml(c.name)}', ${c.devProtect ? 'true' : 'false'})">删除</button>`)
    // 开发保护开关:置于操作末尾,switch 样式;开启后服务关闭/重启时保留此容器进程,删除需弹窗确认
    actions.push(`<span class="switch-wrap" title="开启后:服务关闭/重启时保留此容器进程(下次启动自动接管);删除需弹窗确认">保护<label class="switch"><input type="checkbox" ${c.devProtect ? 'checked' : ''} onchange="toggleProtect('${c.id}', this.checked)"><span class="slider"></span></label></span>`)
    // 版本选择框:替代原「更新」按钮与版本文本位;默认当前版本,切换并确认后触发更新
    const versions = [...new Set([...(catalog.installed ?? []), c.version])]
    const versionSelect = `<select class="ver-select" data-current="${escapeHtml(c.version)}" ${busy ? 'disabled' : ''} onchange="confirmUpdate('${c.id}', this)">${versions.map((v) => `<option value="${escapeHtml(v)}" ${v === c.version ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}</select>`
    // 终端日志统一在底部终端栏显示;卡片只保留日志文件地址
    return `<div class="card">
      <div class="head"><span class="name">${escapeHtml(c.name)}${c.devProtect ? ' 🛡' : ''}</span><span class="badge ${c.status}">${statusBadge}</span></div>
      <div class="meta">${versionSelect} · <span class="chip port-edit" title="点击修改固定端口(下次启动生效)" onclick="editPort('${c.id}', ${c.port ?? 'null'}, '${c.status}')">端口 ${c.port ?? '未分配'}</span> · profile ${escapeHtml(c.profile)} · 创建于 ${c.createdAt ? new Date(c.createdAt * 1000).toLocaleString('zh-CN') : '-'}</div>
      <div class="logpath" title="host 运行日志文件位置">日志: ${escapeHtml(c.logPath ?? `DSHDock_Data/containers/${c.id}/logs/host.log`)}</div>
      ${c.url ? `<div class="url"><a href="${escapeHtml(c.url)}" target="_blank">${escapeHtml(c.url)}</a></div>` : ''}
      ${task?.status === 'failed' ? `<div class="muted" style="margin-bottom:8px">✗ ${escapeHtml(task.label)} 失败 — 详见底部终端</div>` : ''}
      <div class="actions">${actions.join('')}</div>
    </div>`
  }).join('')
  $('#container-list').innerHTML = containers.length ? listHtml : '<div class="panel"><div class="empty">还没有容器,用上方表单创建第一个</div></div>'
}

async function createContainer() {

  try {

    localStorage.setItem('dshdock-last-version', version)
    $('#c-name').value = ''
    toast(`容器 ${name} 创建中`)
    setTimeout(renderContainers, 300)
  } catch (error) { toast(`创建失败: ${error}`, true) }
}
// 版本名自然降序比较(数字段按数值比;前缀相同时短者视为更新,如 0.1.5 > 0.1.5-rc.1)
function versionDesc(a, b) {
  const ta = String(a).split(/(\d+)/), tb = String(b).split(/(\d+)/)
  for (let i = 0; i < Math.max(ta.length, tb.length); i++) {
    const x = ta[i], y = tb[i]
    if (x === undefined) return -1
    if (y === undefined) return 1
    const d = /^\d+$/.test(x) && /^\d+$/.test(y) ? Number(x) - Number(y) : x.localeCompare(y)
    if (d) return -d
  }
  return 0
}

// 修改容器固定端口:仅停止状态可改(服务端亦校验),下次启动生效
async function editPort(id, current, status) {
  if (status === 'running' || status === 'starting') { toast('容器运行中,请先停止再修改端口', true); return }
  const input = prompt('新的固定端口(1024-65535,下次启动生效):', current ?? '')
  if (input === null) return
  const port = Number(input)
  if (!Number.isInteger(port) || port < 1024 || port > 65535) { toast('端口必须是 1024-65535 的整数', true); return }
  if (port === current) return
  try {
    const r = await api(`/api/containers/${id}/port`, { method: 'POST', body: { port } })
    toast(`端口已改为 ${r.port}(下次启动生效)`)
    renderContainers()
  } catch (error) { toast(`修改端口失败: ${error}`, true) }
}
// 版本选择框触发更新:切换即询问,取消则回退显示当前版本
function confirmUpdate(id, selectEl) {
  const target = selectEl.value
  const current = selectEl.dataset.current
  if (target === current) return
  if (!confirm(`将容器更新到 ${target}?\n更新会先停止容器、替换 harness 并重装依赖;profile / workspace / 凭据等用户数据原样保留(向上兼容)。`)) {
    selectEl.value = current
    return
  }
  doUpdate(id, target)
}
async function doUpdate(id, version) {
  try {
    await api(`/api/containers/${id}/update`, { method: 'POST', body: { version } })
    toast(`更新任务已开始 → ${version}(进度见底部终端)`)
    renderContainers()
  } catch (error) { toast(`更新失败: ${error}`, true) }
}

async function saveSettings() {
  try {
    await api('/api/settings', {
      method: 'POST',
      body: {
        proxy: $('#s-proxy').value.trim(),
        githubMirror: $('#s-mirror').value.trim(),
        npmRegistry: $('#s-registry').value.trim(),
        containerPortRange: joinPortRange($('#s-portrange-start').value, $('#s-portrange-end').value),
        autoOpenUiOnStart: $('#s-autoopen').checked,
        skipFirstOpenPrompts: $('#s-skipprompts').checked,
      },
    })
    toast('已保存')
  } catch (error) { toast(`保存失败: ${error}`, true) }
}
// ── 模型配置表:自定义下拉(每项带 ✕ 删除)+ 固定详情表单 ──
let modelViewCache = { models: [], providers: [], presets: [], protocols: [], defaultUid: '' }
let modelDetail = null
let modelDropdownOpen = false

/** 容量显示:整 K/M 才缩写。 */
function capText(n) {
  if (typeof n !== 'number') return ''
  if (n >= 1000000 && n % 1000000 === 0) return `${n / 1000000}M`
  if (n >= 1000 && n % 1000 === 0) return `${n / 1000}K`
  return String(n)
}
/** 容量解析:131072 / 256K / 1M;空 = 不写该字段,非法 = NaN。 */
function parseCap(text) {
  const t = String(text ?? '').replace(/\s+/g, '')
  if (t === '') return undefined
  const m = t.match(/^(\d+(?:\.\d+)?)([km])?$/i)
  if (!m) return NaN
  const n = Number(m[1]) * (m[2] ? (m[2].toLowerCase() === 'k' ? 1000 : 1000000) : 1)
  return Number.isInteger(n) && n > 0 ? n : NaN
}
function modelConfigImportedChip(view) {
  const from = view.importedFrom
  if (!from) return ''
  const when = from.at ? new Date(from.at * 1000).toLocaleString('zh-CN') : ''
  const label = from.migratedFromLegacy ? '已由旧版模板迁移' : `导入自 ${escapeHtml(from.containerName ?? '?')}`
  return `<div class="row" style="margin-bottom:8px"><span class="chip" title="${escapeHtml(when)}">${label}</span></div>`
}

function draftFrom(row) {
  return {
    uid: row.uid, mode: 'edit', id: row.id, name: row.name ?? '', api: row.api ?? '', baseURL: row.baseURL ?? '',
    apiKey: '', apiKeySet: row.apiKeySet === true, apiKeyEnv: row.apiKeyEnv ?? '', label: row.label ?? '',
    ctx: capText(row.contextWindow), max: capText(row.maxTokens), isDefault: row.uid === modelViewCache.defaultUid,
  }
}
function blankDraft() {
  return {
    uid: '', mode: 'new', id: '', name: '', api: modelViewCache.protocols[0] ?? '', baseURL: '', apiKey: '',
    apiKeySet: false, apiKeyEnv: '', label: '', ctx: '', max: '', isDefault: modelViewCache.models.length === 0,
  }
}
/** 详情区永远有内容:选中项被删/表空时自动落到 ★ / 第一个 / 新建草稿。 */
function ensureModelSelection() {
  const models = modelViewCache.models
  if (modelDetail !== null && (modelDetail.uid === '' || models.some((m) => m.uid === modelDetail.uid))) return
  if (models.length === 0) { modelDetail = blankDraft(); return }
  modelDetail = draftFrom(models.find((m) => m.uid === modelViewCache.defaultUid) ?? models[0])
}
async function refreshModelView() {
  modelViewCache = await api('/api/model-configs')
  ensureModelSelection()
  renderModelPanel()
}
function toggleModelDropdown() {
  modelDropdownOpen = !modelDropdownOpen
  renderModelPanel()
}
function selectModel(uid) {
  const row = modelViewCache.models.find((m) => m.uid === uid)
  if (row === undefined) return
  modelDetail = draftFrom(row)
  modelDropdownOpen = false
  renderModelPanel()
}
function newModel() {
  modelDetail = blankDraft()
  modelDropdownOpen = false
  renderModelPanel()
  $('#m-id')?.focus()
}
function applyModelTemplate(presetId) {
  const preset = modelViewCache.presets.find((p) => p.id === presetId)
  if (preset === undefined || modelDetail === null) return
  const sample = (preset.models ?? [])[0] ?? {}
  modelDetail = {
    ...modelDetail,
    api: preset.api ?? modelDetail.api,
    baseURL: preset.baseURL ?? '',
    apiKeyEnv: preset.apiKeyEnv ?? '',
    apiKey: preset.apiKey ?? '',
    label: preset.providerLabel ?? '',
    id: sample.id ?? modelDetail.id,
    name: sample.name ?? '',
    ctx: capText(sample.contextWindow),
    max: capText(sample.maxTokens),
  }
  renderModelPanel()
}
/** 目录提供方(无模型清单,如只配了密钥的 openrouter/deepseek)的移除。 */
async function deletePassthrough(route, event) {
  if (event) event.stopPropagation()
  try {
    await api(`/api/model-configs/passthrough/${encodeURIComponent(route)}`, { method: 'DELETE' })
    toast(`已移除目录提供方 ${route}`)
    modelViewCache = await api('/api/model-configs')
    ensureModelSelection()
    renderModelPanel()
  } catch (error) { toast(`移除失败: ${error}`, true) }
}

/** 每项最前方的 ★/☆:点一下立刻把该模型设为默认(不关下拉、不重排)。 */
async function setDefaultRow(uid, event) {
  if (event) event.stopPropagation()
  if (uid === modelViewCache.defaultUid) return
  const row = modelViewCache.models.find((m) => m.uid === uid)
  try {
    await api('/api/model-configs/default', { method: 'POST', body: { uid } })
    modelViewCache = await api('/api/model-configs')
    if (modelDetail !== null && modelDetail.uid !== 'new') modelDetail.isDefault = modelDetail.uid === uid
    renderModelPanel()
    toast(`默认模型 → ${row?.id ?? ''}`)
  } catch (error) { toast(`设置失败: ${error}`, true) }
}

/** 下拉项末尾的 ✕:删完保持下拉打开,列表就地刷新。 */
async function deleteModelRow(uid, event) {
  if (event) event.stopPropagation()
  const row = modelViewCache.models.find((m) => m.uid === uid)
  if (row === undefined) return
  try {
    await api(`/api/model-configs/models/${encodeURIComponent(uid)}`, { method: 'DELETE' })
    toast(`已删除 ${row.id}`)
    if (modelDetail !== null && modelDetail.uid === uid) modelDetail = null
    modelViewCache = await api('/api/model-configs')
    ensureModelSelection()
    renderModelPanel()
  } catch (error) { toast(`删除失败: ${error}`, true) }
}

function renderModelPanel() {
  const label = $('#model-dd-label')
  if (label === null) return
  const current = modelDetail
  label.textContent = current === null
    ? '选择模型…'
    : (current.uid === ''
        ? '（新模型，未保存）'
        : `${current.uid === modelViewCache.defaultUid ? '★ ' : ''}${current.id}${current.label ? ` · ${current.label}` : ''}`)
  const panel = $('#model-dd-panel')
  if (panel !== null) {
    panel.hidden = !modelDropdownOpen
    panel.innerHTML = modelViewCache.models.length === 0
      ? '<div class="dd-item" style="cursor:default"><span class="muted">表里还没有模型</span></div>'
      : modelViewCache.models.map((m) => `<div class="dd-item ${modelDetail !== null && modelDetail.uid === m.uid ? 'active' : ''}" onclick="selectModel('${m.uid}')">
          <button type="button" class="dd-star ${m.uid === modelViewCache.defaultUid ? 'on' : ''}" title="${m.uid === modelViewCache.defaultUid ? '当前默认模型' : '设为默认模型'}" onclick="setDefaultRow('${m.uid}', event)">${m.uid === modelViewCache.defaultUid ? '★' : '☆'}</button>
          <b class="dd-name">${escapeHtml(m.name || m.id)}</b>
          <span class="dd-prov">${escapeHtml(m.providerLabel || '')}</span>
          <span style="flex:1"></span>
          <button type="button" class="dd-x" title="删除这个模型" onclick="deleteModelRow('${m.uid}', event)">✕</button>
        </div>`).join('') + (modelViewCache.passthrough ?? []).map((p) => `<div class="dd-item">
          <span class="dd-tag">目录</span>
          <b>${escapeHtml(p.route)}</b>
          <span class="muted">${escapeHtml(p.displayName ?? '')}</span>
          <span class="muted">模型由 DSH 目录提供</span>
          <span style="flex:1"></span>
          <button type="button" class="dd-x" title="移除这个目录提供方" onclick="deletePassthrough('${escapeHtml(p.route)}', event)">✕</button>
        </div>`).join('')
  }
  renderModelDetail()
  const note = $('#model-providers')
  if (note !== null) {
    const groups = modelViewCache.providers.length > 0
      ? `将写入 ${modelViewCache.providers.length} 个提供方:${modelViewCache.providers.map((p) => `${p.route}(${p.modelCount})`).join('、')}`
      : '表里还没有模型。'
    const pass = (modelViewCache.passthrough ?? []).map((p) => `${p.route}${p.apiKeySet ? '' : '(缺密钥)'}`)
    note.textContent = pass.length > 0 ? `${groups};另有目录提供方(无模型清单,原样注入):${pass.join('、')}` : groups
  }
}
function renderModelDetail() {
  const box = $('#model-detail')
  if (box === null) return
  const d = modelDetail ?? blankDraft()
  const actionLabel = d.uid === 'new' ? '保存为新模型' : '保存'
  const templates = modelViewCache.presets.map((p) => `<span class="chip" onclick="applyModelTemplate('${p.id}')">${escapeHtml(p.label)}</span>`).join('')
  box.innerHTML = `<div class="prov-row" style="display:block">
    <div class="row" style="margin-bottom:8px"><span class="muted">快速填充</span>${templates}
      <span style="flex:1"></span><span class="muted">${d.uid === 'new' ? '新建:填好后保存' : `当前:${escapeHtml(d.id)}`}</span></div>
    <div class="field"><label>模型 ID</label><input id="m-id" placeholder="提供方暴露的模型名" value="${escapeHtml(d.id)}"></div>
    <div class="field"><label>显示名</label><input id="m-name" placeholder="留空用模型 ID" value="${escapeHtml(d.name)}"></div>
    <div class="field"><label>API 地址</label><input id="m-base" placeholder="https://gateway.example/v1" value="${escapeHtml(d.baseURL)}"></div>
    <div class="field"><label>API 协议</label><select id="m-api" class="ver-select" style="max-width:none">${modelViewCache.protocols.map((x) => `<option value="${x}" ${d.api === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>API 密钥</label><input type="password" id="m-key" autocomplete="off" placeholder="${d.apiKeySet ? '已配置——输入新值可替换,留空保持不变' : '输入 API 密钥(本地服务可填占位,如 local)'}" value="${escapeHtml(d.apiKey)}"></div>
    <div class="field"><label>提供方名称</label><input id="m-label" placeholder="同名的模型会归到同一个提供方(留空按地址主机名)" value="${escapeHtml(d.label)}"></div>
    <div class="field"><label>上下文窗口</label><input id="m-ctx" placeholder="256K" style="max-width:120px" value="${escapeHtml(d.ctx)}">
      <label style="width:auto;margin-left:8px">最大输出</label><input id="m-max" placeholder="32K" style="max-width:120px" value="${escapeHtml(d.max)}"></div>
    <div class="row" style="margin-top:8px">
      <span class="muted">${savePreview(d)}</span>
      <span id="m-err" style="color:var(--dsw-state-error);font-size:12.5px"></span>
      <span style="flex:1"></span>
      <button class="danger" ${d.uid === '' ? 'disabled' : ''} onclick="deleteSelectedModel()">删除</button>
      <button class="primary" onclick="saveModel()">${actionLabel}</button>
    </div>
  </div>`
}
/**
 * 保存目标判定:拿表单的三元组 (模型 ID, 协议, 端点) 与列表比对 ——
 * 命中已有行 = 旧数据 → 更新那一行;没有命中 = 新数据 → 新建一行。
 * 不做「改 ID 就当更新同一行」这类猜测:改了 ID 在 DSH 里就是另一个模型,
 * 只会新建(旧行留着,想要就去掉)。
 */
function resolveSaveTarget(d) {
  const exact = modelViewCache.models.find((m) => m.id === d.id && (m.api ?? '') === d.api && (m.baseURL ?? '') === d.baseURL)
  return exact === undefined ? { uid: '', action: 'create' } : { uid: exact.uid, action: 'update' }
}
/** 详情里的一行提示:这次保存会新建还是更新哪一行(冲突一眼可见)。 */
function savePreview(d) {
  if (d.id === '') return ''
  const target = resolveSaveTarget({ ...d, uid: modelDetail?.uid ?? '' })
  return target.action === 'create' ? '将新建一行模型' : `将更新:${modelViewCache.models.find((m) => m.uid === target.uid)?.id ?? ''}`
}
function readModelDetail() {
  return {
    id: $('#m-id').value.trim(),
    name: $('#m-name').value.trim(),
    api: $('#m-api').value,
    baseURL: $('#m-base').value.trim(),
    apiKeyEnv: modelDetail?.apiKeyEnv ?? '',
    uid: modelDetail?.uid ?? '',
    apiKey: $('#m-key').value,
    label: $('#m-label').value.trim(),
    contextWindow: parseCap($('#m-ctx').value),
    maxTokens: parseCap($('#m-max').value),
  }
}
async function saveModel() {
  const d = readModelDetail()
  const fail = (message) => { const box = $('#m-err'); if (box) box.textContent = message; else toast(message, true) }
  if (d.id === '') return fail('模型 ID 不能为空')
  if (!/^https?:\/\/\S+$/.test(d.baseURL)) return fail('API 地址必须是 http(s):// 开头的有效地址')
  if (Number.isNaN(d.contextWindow) || Number.isNaN(d.maxTokens)) return fail('容量需为数字,可加 K 或 M 后缀')
  try {
    const body = { model: { id: d.id, name: d.name, api: d.api, baseURL: d.baseURL, label: d.label } }
    if (d.apiKeyEnv) body.model.apiKeyEnv = d.apiKeyEnv
    if (d.contextWindow !== undefined) body.model.contextWindow = d.contextWindow
    if (d.maxTokens !== undefined) body.model.maxTokens = d.maxTokens
    if (d.apiKey !== '') body.apiKey = d.apiKey
    const target = resolveSaveTarget(d)
    await api(`/api/model-configs/models/${target.uid === '' ? 'new' : encodeURIComponent(target.uid)}`, { method: 'PUT', body })
    toast(target.action === 'create' ? `已新建 ${d.id}` : `已更新 ${d.id}`)
    modelViewCache = await api('/api/model-configs')
    modelDetail = null
    ensureModelSelection()
    renderModelPanel()
  } catch (error) { fail(String(error)) }
}
async function deleteSelectedModel() {
  if (modelDetail === null || modelDetail.uid === 'new') return
  const uid = modelDetail.uid
  try {
    await api(`/api/model-configs/models/${encodeURIComponent(uid)}`, { method: 'DELETE' })
    toast(`已删除 ${modelDetail.id}`)
    modelDetail = null
    modelViewCache = await api('/api/model-configs')
    ensureModelSelection()
    renderModelPanel()
  } catch (error) { toast(`删除失败: ${error}`, true) }
}
async function importModelConfig() {
  const containerId = $('#s-impsrc')?.value
  if (!containerId) return toast('请选择来源容器(需已启动并完成一次模型配置)', true)
  try {
    const r = await api('/api/model-configs/import', { method: 'POST', body: { containerId } })
    const info = r.import ?? {}
    toast(`导入完成:新增 ${(info.added ?? []).length} / 更新 ${(info.updated ?? []).length} 个模型${(info.refKeys ?? []).length ? `,API Key ${info.refKeys.length} 枚` : ''}`)
    modelDetail = null
    modelViewCache = await api('/api/model-configs')
    ensureModelSelection()
    renderModelPanel()
  } catch (error) { toast(`导入失败: ${error}`, true) }
}
// 点空白处收起下拉
document.addEventListener('click', (event) => {
  if (!modelDropdownOpen) return
  if (event.target.closest('#model-dd') === null) {
    modelDropdownOpen = false
    renderModelPanel()
  }
})

// ── 弹窗 ──
function openModal(title, html) {
  clearInterval(window.__logTimer)
  $('#modal-title').textContent = title
  $('#modal-body').innerHTML = html
  $('#modal-mask').style.display = 'flex'
}
function closeModal() {
  clearInterval(window.__logTimer)
  $('#modal-mask').style.display = 'none'
}
$('#modal-mask').addEventListener('click', (e) => { if (e.target === $('#modal-mask')) closeModal() })

// ── 部署目录引导 ──
function renderOnboarding(suggestion) {
  $('#nav').style.visibility = 'hidden'
  $('#main').innerHTML = `
    <h1>欢迎使用 DSH Dock</h1><div class="subtitle">首次使用,请选择部署目录 —— 所有版本、容器与数据都将存放在这里</div>
    <div class="panel"><h2>选择部署目录</h2>
      <div class="row">
        <input id="ob-path" style="width:420px" value="${escapeHtml(suggestion || '')}" placeholder="绝对路径,例如 /home/user/DSHDock-data">
        <button onclick="browseDirectory()">浏览...</button>
        <button class="primary" onclick="submitOnboarding()">确定</button>
      </div>
      <p class="muted" style="margin-top:12px;line-height:1.7">
        目录不存在会自动创建。选择后应用将初始化目录结构(versions/containers/state 等);DSH 运行时(node/pnpm)由应用自动解析,无需手动准备。
      </p>
      <div id="ob-error" class="error-text"></div>
    </div>`
}
async function browseDirectory() {
  const btn = event?.target
  if (btn) { btn.disabled = true; btn.textContent = '选择中...' }
  try {
    const r = await api('/api/pick-directory', { method: 'POST' })
    if (r.path) $('#ob-path').value = r.path
    else if (r.error) $('#ob-error').textContent = r.error
  } catch (error) {
    $('#ob-error').textContent = String(error)
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '浏览...' }
  }
}
async function submitOnboarding() {
  const value = $('#ob-path').value.trim()
  if (!value) return
  try {
    await api('/api/onboarding', { method: 'POST', body: { dataRoot: value } })
    $('#nav').style.visibility = 'visible'
    renderCurrent()
  } catch (error) {
    $('#ob-error').textContent = String(error)
  }
}

async function boot() {
  try {
    const ob = await api('/api/onboarding')
    if (ob.needed) return renderOnboarding(ob.suggestion)
  } catch {}
  renderCurrent()
}
boot()
</script>
