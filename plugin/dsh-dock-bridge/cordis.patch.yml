# dsh-dock-bridge 激活 patch(参考件)。
#
# 将下面的 insert 块复制进目标容器 profile 的 cordis.patch.yml
# ($DSH_HOME/profiles/<profile>/cordis.patch.yml),web profile 写入即热挂载。
# 注意:name 必须用相对路径(./node_modules/...),不要用裸包名。
- insert:
    - id: dshdock-bridge
      name: ./node_modules/dsh-dock-bridge/src/index.js
      inject: [tools]
      config:
        baseUrl: http://127.0.0.1:7940
